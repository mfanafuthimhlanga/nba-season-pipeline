name: 'nba'
version: '1.0.0'

# Connection profile "nba" (~/.dbt/profiles.yml locally; the job's dbt task in Databricks).
profile: 'nba'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Schemas are used as named (macros/generate_schema_name.sql), not prefixed with
# the target schema: staging -> nba.staging, not nba.gold_staging.
models:
  nba:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: gold
      +materialized: table

seeds:
  nba:
    +schema: staging
