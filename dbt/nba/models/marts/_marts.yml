version: 2

models:
  - name: dim_team
    description: One row per team, with the latest name and abbreviation plus conference and division from the team_conferences seed.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('team_conferences')
    columns:
      - name: team_id
        data_tests: [unique, not_null]
      - name: team_abbr
        data_tests: [unique, not_null]
      - name: team_name
        data_tests: [not_null]
      - name: conference
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['East', 'West']
      - name: division
        data_tests: [not_null]
  
  - name: fct_team_game
    description: One row per team per completed game, with possessions, ratings, pace, result and rest days.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, team_id]
    columns:
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: opponent_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: possessions
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 70
                max_value: 130
      - name: won
        data_tests: [not_null]

  - name: fct_player_game
    description: One row per player per completed game, DNP rows included, with true shooting % and game score.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "game_score is not null"
          config:
            where: "not did_not_play"
    columns:
      - name: player_id
        data_tests: [not_null]
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: opponent_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: did_not_play
        data_tests: [not_null]
      - name: ts_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.5

  - name: dim_player
    description: One row per player, with the latest name, position and team from their most recent game.
    columns:
      - name: player_id
        data_tests: [unique, not_null]
      - name: player_name
        data_tests: [not_null]
      - name: current_team_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

  - name: mart_daily_leaders
    description: Top 10 players by game score for each game date.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_date, player_id]
    columns:
      - name: daily_rank
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10

  - name: mart_team_form
    description: One row per team, regular-season record and form over its last 10 games, as of the latest game.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_team')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "wins + losses = games"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last10_wins + last10_losses = last10_games"
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: win_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: last10_games
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: conference_rank
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 15


  - name: mart_player_consistency
    description: One row per player with 10 or more regular-season games played, with scoring averages, spread and season true shooting.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "games_played >= 10"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stddev_pts >= 0"
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_id
      - name: current_team_abbr
        data_tests: [not_null]
      - name: season_ts_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.5


  - name: mart_home_away
    description: One row per team, regular-season home and away record and net rating, and the difference between them.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_team')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "home_games + away_games = games"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "home_wins <= home_games and away_wins <= away_games"
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: home_win_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: away_win_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_back_to_back_impact
    description: One row per team, regular-season performance on the second night of back-to-backs compared with rested games.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_team')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "b2b_games + rested_games = games"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "b2b_wins <= b2b_games and rested_wins <= rested_games"
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: rested_games
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: b2b_fg_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1