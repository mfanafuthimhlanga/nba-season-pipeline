version: 2

models:
  - name: int_team_game_with_opponent
    description: One row per team per completed game, with that game's opponent stats side by side.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [game_id, team_id]
      - dbt_utils.expression_is_true:
          expression: "team_id <> opponent_team_id"
      - dbt_utils.expression_is_true:
          expression: "pts <> opp_pts"
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_games')
              field: game_id
      - name: team_id
        data_tests: [not_null]
      - name: opponent_team_id
        data_tests: [not_null]
      - name: pts
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 50
              max_value: 200
      - name: opp_pts
        data_tests: [not_null]