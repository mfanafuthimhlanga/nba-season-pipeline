version: 2

models:
  - name: stg_games
    description: One row per game from silver.games, with a season label, season type name and overtime periods.
    columns:
      - name: game_id
        data_tests: [unique, not_null]
      - name: game_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['STATUS_FINAL', 'STATUS_POSTPONED', 'STATUS_CANCELED']

  - name: stg_team_game_stats
    description: One row per team per game from silver.team_game_stats.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, team_id]
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
      - name: team_id
        data_tests: [not_null]

  - name: stg_player_game_stats
    description: One row per player per game from silver.player_game_stats, DNP rows included.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id]
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
      - name: player_id
        data_tests: [not_null]
      - name: did_not_play
        data_tests: [not_null]
